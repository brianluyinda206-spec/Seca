name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;36.0.0
            ndk;28.0.13004108

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all app debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :apps:catalog:assembleDebug \
            :apps:contacts:assembleDebug \
            :apps:phone:assembleDebug \
            :apps:messages:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: seca-debug-apks
          path: apps/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
